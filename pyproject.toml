[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dnse-openapi"
version = "0.1.0"
description = "Typed Python client and local server for the DNSE OpenAPI (LightSpeed) platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dnse_openapi contributors" }]
keywords = ["dnse", "trading", "openapi", "stocks", "derivatives"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
]
stream = [
  "websockets>=12,<18",
  "msgpack>=1,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
  "websockets>=12,<18",
  "msgpack>=1,<2",
]

[project.scripts]
dnse-openapi = "dnse_openapi.server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dnse_openapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection uses calls in argument defaults by design.
"src/dnse_openapi/server/app.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dnse_openapi"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["msgpack.*", "websockets.*"]
ignore_missing_imports = true
